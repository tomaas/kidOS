# Project name pinned so the named volumes stay `kidos_*` whatever the
# checkout folder is called — renaming the clone must never orphan the
# app-data volume (it holds the SQLite db and the generated media).
name: kidos

services:
  app:
    build:
      context: .
      args:
        VITE_CHILD_NAME: ${VITE_CHILD_NAME:-}
    image: kidos
    container_name: kidos
    env_file: .env.production
    ports:
      # Loopback only — the app has no auth; exposing it beyond this
      # machine must be a deliberate operator choice.
      - "127.0.0.1:3009:3009"
    volumes:
      # Generated images/audio + the SQLite db file (data/app.db).
      - app-data:/app/data
    restart: unless-stopped

volumes:
  app-data:
